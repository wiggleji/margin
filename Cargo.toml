[workspace]
resolver = "3"
members = ["crates/margin-core", "crates/margin-mcp", "crates/margin-app"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
# Never upload to crates.io by accident (distributed as an app, not a library).
publish = false
rust-version = "1.95"

[workspace.dependencies]
margin-core = { path = "crates/margin-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
base64 = "0.23"

# Size/latency-oriented release profile: the app's #1 goal is "super light".
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2   # keep egui snappy in debug builds
