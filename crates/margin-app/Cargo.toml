[package]
name = "margin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Margin — a super-light git client with Markdown notes and task tracking"

[[bin]]
name = "margin"
path = "src/main.rs"

[dependencies]
margin-core.workspace = true
pulldown-cmark.workspace = true
# glow (OpenGL) instead of wgpu: much smaller binary, faster cold start.
# No `persistence`/ron, no `links`/webbrowser (we open URLs via `open`).
eframe = { version = "0.37", default-features = false, features = [
    "glow", "default_fonts", "system_fonts", "clipboard", "accesskit",
] }
emojis = "0.9"
# System font list for Settings → Appearance (same versions egui uses for its fallback fonts).
fontique = { version = "0.13", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Font files are memory-mapped, not copied (Apple Color Emoji is ~180 MB).
memmap2 = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.18", default-features = false }
# Native menu bar (File, Edit, …) and clipboard for its Edit → Paste.
muda = { version = "0.21", default-features = false }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
