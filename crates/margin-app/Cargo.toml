[package]
name = "margin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Margin — a super-light git client with Markdown notes and task tracking"

[[bin]]
name = "margin"
path = "src/main.rs"

[dependencies]
margin-core.workspace = true
pulldown-cmark.workspace = true
# glow (OpenGL) instead of wgpu: much smaller binary, faster cold start.
# No `persistence`/ron, no `links`/webbrowser (we open URLs via `open`).
eframe = { version = "0.37", default-features = false, features = [
    "glow", "default_fonts", "system_fonts", "clipboard", "accesskit",
] }
emojis = "0.9"
# System font list for Settings → Appearance (same versions egui uses for its fallback fonts).
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Font files are memory-mapped, not copied (Apple Color Emoji is ~180 MB).
memmap2 = "0.9"

[build-dependencies]
# icon and version details in margin.exe (used only when building for Windows)
winresource = { version = "0.1", default-features = false }

# Native folder dialogs (Linux uses zenity / kdialog instead: no GTK dependency).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies]
# named pipe for `margin <dir>` handing folders to the running window; a
# message box when no renderer starts
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
# A second renderer for Windows without OpenGL 2+ (virtual machines, Remote
# Desktop, no graphics driver): Direct3D 12, which has a software renderer
# (WARP). Only Direct3D: no Vulkan, no GL through wgpu.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native menu bar (File, Edit, …) and clipboard for its Edit → Paste.
muda = { version = "0.21", default-features = false }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
