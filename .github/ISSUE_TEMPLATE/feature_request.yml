name: Feature request
description: An idea for Margin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or problem, in your words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Margin help?
      description: Your idea for it, if you have one. Sketches and screenshots of other apps are welcome.
