# Build and test on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (egui / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Rust (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  macos:
    name: macOS · test and package (unsigned)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
      - name: Rust (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Package Margin.app and the DMG (ad-hoc signed, this Mac's architecture)
        run: scripts/package-macos.sh --dev --native
      - uses: actions/upload-artifact@v4
        with:
          name: margin-dev-dmg
          path: dist/*.dmg
          retention-days: 7
