# Build Margin for macOS, Windows and Linux, and publish one release with
# every download. (The file keeps its old name so the Run workflow button
# and its history stay where they were.)
#
#   Actions → "Release" → Run workflow (on main), "Publish a release" ticked
#       → builds on all three, creates the tag v<Cargo version>, publishes the release
#   the same with it unticked → only builds; the files are artifacts of the run
#   push a tag v0.2.0  → builds and publishes that release (the tag must match Cargo.toml)
#
# Downloads:
#   macOS    Margin-<v>.dmg (universal), Margin-<v>-macos.zip (in-app updates)
#   Windows  Margin-<v>-windows-x64-setup.exe (installer), Margin-<v>-windows-x64.zip
#   Linux    Margin-<v>-x86_64.AppImage, margin_<v>_amd64.deb, margin-<v>-linux-x64.tar.gz
# each with a .sha256.
#
# With the Apple secrets set (docs/RELEASING.md) the Mac app and DMG are
# Developer ID signed and notarized:
#   secrets:   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY,
#              NOTARY_API_KEY_P8, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID
# Without them the DMG is ad-hoc signed and the release notes say how to open it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tags v<version from Cargo.toml> on this commit). Unticked: only build."
        type: boolean
        default: true

permissions:
  contents: write # create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Which release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      publish: ${{ steps.which.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # a pushed tag must match the version it releases
            [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo version $version"; exit 1; }
            publish=true
          else
            publish="$PUBLISH_INPUT"
            if [ "$publish" = true ]; then
              [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are published from main (this run is on $GITHUB_REF_NAME)"; exit 1; }
              if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "::error::v$version is already released: bump the version in Cargo.toml first"; exit 1
              fi
            fi
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Margin $version · publish: $publish"

  macos:
    name: macOS
    needs: prepare
    runs-on: macos-latest # Apple Silicon; also cross-builds the Intel half
    timeout-minutes: 60
    outputs:
      signed: ${{ env.SIGNED }}
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY_P8 != '' }}
      MARGIN_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MARGIN_NOTARY_PROFILE: margin-notary
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count; build date = last commit

      - name: Rust (from rust-toolchain.toml) and both Mac targets
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate and notary credentials
        if: env.SIGNED == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/margin-build.keychain-db"
          echo "MARGIN_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV" # used by the script and cleanup
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          # Put the build keychain first in the search list so codesign finds the identity.
          existing=()
          while IFS= read -r k; do
            k="${k//\"/}"; k="${k#"${k%%[![:space:]]*}"}"
            [ -n "$k" ] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KC" ${existing[@]+"${existing[@]}"}
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$MARGIN_NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KC"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$KC"

      - name: Build, sign, notarize, package
        if: env.SIGNED == 'true'
        run: scripts/package-macos.sh

      - name: Build and package (unsigned — no Apple secrets set)
        if: env.SIGNED != 'true'
        run: scripts/package-macos.sh --dev

      - uses: actions/upload-artifact@v7
        with:
          name: Margin-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Remove build keychain
        if: always()
        run: '[ -n "${MARGIN_NOTARY_KEYCHAIN:-}" ] && security delete-keychain "$MARGIN_NOTARY_KEYCHAIN" || true'

  windows:
    name: Windows
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build and package
        run: scripts\package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Margin-Windows
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64.zip
            dist/*-windows-x64*.sha256
          if-no-files-found: error

  linux:
    name: Linux
    needs: prepare
    # the oldest supported Ubuntu: the binary then runs on glibc 2.35 and newer
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: System libraries (egui / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Rust (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Margin-Linux
          path: |
            dist/*.deb
            dist/*-linux-x64.tar.gz
            dist/Margin-*-x86_64.AppImage
            dist/*.deb.sha256
            dist/*-linux-x64.tar.gz.sha256
            dist/Margin-*-x86_64.AppImage.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, macos, windows, linux]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      # a token that can push to wiggleji/homebrew-tap (docs/RELEASING.md); without it the tap isn't updated
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: packaging/homebrew
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          sha() { cut -d' ' -f1 "dist/$1.sha256"; }
          {
            echo "## Download"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **macOS** (Apple Silicon and Intel) | **Margin-$v.dmg**, or \`brew install --cask wiggleji/tap/margin\` |"
            echo "| **Windows** (64-bit) | **Margin-$v-windows-x64-setup.exe** (installer), or the portable **Margin-$v-windows-x64.zip** |"
            echo "| **Linux** (x64) | **Margin-$v-x86_64.AppImage** (any distribution), **margin_${v}_amd64.deb** (Debian, Ubuntu), or **margin-$v-linux-x64.tar.gz** |"
            echo
            echo "### macOS"
            echo "Open the DMG and drag **Margin** into **Applications**."
            if [ "$SIGNED" != "true" ]; then
              echo "This build isn't notarized by Apple yet, so macOS blocks the first open: run"
              echo "\`xattr -dr com.apple.quarantine /Applications/Margin.app\` in Terminal, or open Margin once, then"
              echo "**System Settings → Privacy & Security → Open Anyway**."
            fi
            echo "Already using Margin 0.2 or later? It updates itself (**Margin → Check for Updates…**)."
            echo
            echo "### Windows"
            echo "Run the installer (no administrator rights needed; it can add \`margin\` to PATH). Margin needs [Git for Windows](https://git-scm.com/download/win)."
            echo "The installer isn't code-signed yet, so SmartScreen may say *Windows protected your PC*: click **More info → Run anyway**."
            echo
            echo "### Linux"
            echo "**AppImage:** \`chmod +x Margin-$v-x86_64.AppImage\` and run it (it updates itself). **Debian/Ubuntu:** \`sudo apt install ./margin_${v}_amd64.deb\`. **Any distribution:** unpack the tar.gz and run \`./install.sh\` (installs to ~/.local). Needs \`git\`; \`zenity\` or \`kdialog\` for folder pickers."
            echo
            echo "Agents (MCP): \`margin-mcp\` is next to the app (macOS: \`/Applications/Margin.app/Contents/MacOS/margin-mcp\`)."
            echo
            echo "<details><summary>SHA-256</summary>"
            echo
            for f in "Margin-$v.dmg" "Margin-$v-windows-x64-setup.exe" "Margin-$v-windows-x64.zip" "Margin-$v-x86_64.AppImage" "margin_${v}_amd64.deb" "margin-$v-linux-x64.tar.gz"; do
              echo "- \`$(sha "$f")\`  $f"
            done
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/notes.md"
          ls -la dist
          # creates the tag on this commit when it doesn't exist yet (manual runs)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest --title "Margin $v" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          sha="$(cut -d' ' -f1 "dist/Margin-$v.dmg.sha256")"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/wiggleji/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$v/g" -e "s/@SHA256@/$sha/g" src/packaging/homebrew/margin.rb.in > tap/Casks/margin.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/margin.rb
          git diff --cached --quiet && { echo "cask already at $v"; exit 0; }
          git commit -m "margin $v"
          git push origin HEAD
