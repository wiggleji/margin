# Build the macOS DMG (universal: Apple Silicon + Intel) on a macOS runner.
#
#   push a tag v0.1.0  → builds and publishes a GitHub release with the DMG
#   Actions → "Release macOS" → Run workflow → builds and uploads the DMG as an artifact
#
# With the Apple secrets set (docs/RELEASING.md) the app and the DMG are
# Developer ID signed and notarized, so they open with no warnings:
#   secrets:   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY,
#              NOTARY_API_KEY_P8, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID
# Without them the DMG is ad-hoc signed: macOS asks to confirm on first open,
# and the release notes say how.
name: Release macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: macos-latest # Apple Silicon; also cross-builds the Intel half
    timeout-minutes: 60
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY_P8 != '' }}
      MARGIN_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MARGIN_NOTARY_PROFILE: margin-notary
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count; build date = last commit

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo version $version"; exit 1; }

      - name: Rust (from rust-toolchain.toml) and both Mac targets
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate and notary credentials
        if: env.SIGNED == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/margin-build.keychain-db"
          echo "MARGIN_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV" # used by the script and cleanup
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          # Put the build keychain first in the search list so codesign finds the identity.
          existing=()
          while IFS= read -r k; do
            k="${k//\"/}"; k="${k#"${k%%[![:space:]]*}"}"
            [ -n "$k" ] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KC" ${existing[@]+"${existing[@]}"}
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$MARGIN_NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KC"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$KC"

      - name: Build, sign, notarize, package
        if: env.SIGNED == 'true'
        run: scripts/package-macos.sh

      - name: Build and package (unsigned — no Apple secrets set)
        if: env.SIGNED != 'true'
        run: scripts/package-macos.sh --dev

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Margin-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(cd dist && ls *.dmg)"
          {
            echo "## Install"
            echo
            echo "1. Download **$dmg** below (one download for Apple Silicon and Intel Macs)."
            echo "2. Open it and drag **Margin** into **Applications**."
            if [ "$SIGNED" != "true" ]; then
              echo "3. This build isn't notarized by Apple yet, so macOS blocks the first open. Either run"
              echo "   \`xattr -dr com.apple.quarantine /Applications/Margin.app\` in Terminal, or open Margin once, then"
              echo "   **System Settings → Privacy & Security → Open Anyway**. After that it opens normally."
            fi
            echo
            echo "Agents (MCP): point your client at \`/Applications/Margin.app/Contents/MacOS/margin-mcp\`."
            echo
            echo "Already using Margin 0.2 or later? It updates itself (Margin → Check for Updates…)."
            echo
            echo "SHA-256 ($dmg): \`$(cut -d' ' -f1 "dist/$dmg.sha256")\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.sha256 \
            --latest --title "Margin ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Remove build keychain
        if: always()
        run: '[ -n "${MARGIN_NOTARY_KEYCHAIN:-}" ] && security delete-keychain "$MARGIN_NOTARY_KEYCHAIN" || true'
