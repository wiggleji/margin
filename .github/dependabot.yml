# Weekly pull requests to keep dependencies current.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # one PR for all minor / patch updates instead of one per crate
      cargo-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # Font crates egui ships with: Margin uses egui's versions (one copy in
      # the app). They move together with egui, in the egui upgrade PR.
      - dependency-name: fontique
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: skrifa
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
